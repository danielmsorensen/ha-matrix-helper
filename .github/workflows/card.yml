name: Card

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

permissions: {}

jobs:
  card:
    name: "Lint, build, and check the bundle"
    runs-on: "ubuntu-latest"
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # The integration serves the committed bundle, so it must match the
      # source; rebuild with scripts/build-card and commit the result.
      - name: Check the committed bundle is up to date
        run: git diff --exit-code -- ../custom_components/matrix_helper/www
